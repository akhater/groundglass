name: Test APK

# An Android build to try on a phone before a release, only when asked: add the
# label test-apk to a pull request, or run this workflow by hand. Nothing is
# published; the APK stays on the run as an artifact for 7 days. It installs
# beside the released app, as co.groundglass.app.test, so it can't replace it.
# The release key signs it so that each test build updates the last one.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  android:
    name: build (android_arm64)
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'test-apk' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      CONFIG: '{"identifier":"co.groundglass.app.test"}'
      APK: Groundglass_test_android_arm64.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android
          rustflags: ''
          cache-workspaces: src-tauri

      - name: Generate the Android project
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          NDK_HOME="$ANDROID_NDK_LATEST_HOME" npx tauri android init --ci --config "$CONFIG"
          cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/
          sed -i 's/>Groundglass</>Groundglass Test</g' src-tauri/gen/android/app/src/main/res/values/strings.xml

      - name: Build
        run: npx tauri android build --apk --target aarch64 --ci --config "$CONFIG"

      - name: Sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -1)
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
          "$tools/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-pass env:KS_PASS \
            --out "$APK" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "$APK"
          rm "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: groundglass-test-apk
          path: ${{ env.APK }}
          retention-days: 7
          if-no-files-found: error
