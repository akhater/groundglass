[package]
name = "tauri-plugin-camera-link"
description = "Wakes a paired Canon camera over Bluetooth and joins its Wi-Fi (Android)."
version = "0.1.0"
edition = "2024"
publish = false
links = "tauri-plugin-camera-link"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1.0", features = ["derive"] }
