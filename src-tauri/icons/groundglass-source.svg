<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Frosted slate glass, lit from upper-left like the Argentum tile -->
    <linearGradient id="tile" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%"   stop-color="#4d6a73"/>
      <stop offset="45%"  stop-color="#2a3f46"/>
      <stop offset="100%" stop-color="#16232a"/>
    </linearGradient>
    <!-- Soft glow in the middle, like light through a focusing screen -->
    <radialGradient id="frost" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#cfe3e8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#cfe3e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="35%"  stop-color="#eaf1f3"/>
      <stop offset="55%"  stop-color="#a9bcc2"/>
      <stop offset="75%"  stop-color="#e3ecef"/>
      <stop offset="100%" stop-color="#97aab0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#9fb6bd" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#56707a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c8dadf" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="72" y="72" width="880" height="880" rx="150" fill="url(#tile)"/>
  <rect x="72" y="72" width="880" height="880" rx="150" fill="url(#frost)"/>

  <!-- Focusing screen etched in the glass: centre circle, crosshair, corner brackets -->
  <g fill="none" stroke="#cfe3e8" stroke-opacity="0.22" stroke-width="8" stroke-linecap="round">
    <circle cx="512" cy="512" r="300"/>
    <line x1="512" y1="150" x2="512" y2="240"/>
    <line x1="512" y1="784" x2="512" y2="874"/>
    <line x1="150" y1="512" x2="240" y2="512"/>
    <line x1="784" y1="512" x2="874" y2="512"/>
    <path d="M182 262 V182 H262"/>
    <path d="M762 182 H842 V262"/>
    <path d="M842 762 V842 H762"/>
    <path d="M262 842 H182 V762"/>
  </g>

  <rect x="72" y="72" width="880" height="880" rx="150" fill="none"
        stroke="url(#edge)" stroke-width="10"/>

  <!-- Gg -->
  <text x="512" y="690" text-anchor="middle"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="480" font-weight="700" fill="url(#silver)"
        letter-spacing="-14">Gg</text>
</svg>
